
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMBER — Habit Tracker</title>
<style>
:root {
 --bg:#101114;
 --panel:#1b1d21;
 --panel2:#23262b;
 --line:#33363c;
 --text:#f4f4f4;
 --muted:#94979e;
 --orange:#ff9340;
 --green:#53c68c;
 --red:#e96a6a;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,
 "Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
aside{
 width:245px;background:#17191c;
 border-right:1px solid var(--line);
 padding:30px 18px;flex-shrink:0;
}
.logo{
 font-size:27px;font-weight:900;
 letter-spacing:2px;margin:0 12px 40px;
}
.logo span{color:var(--orange)}
.nav{
 width:100%;display:block;text-align:left;
 border:0;border-radius:12px;padding:15px;
 background:transparent;color:var(--muted);
 margin-bottom:7px;
}
.nav.active{background:#35291f;color:var(--orange)}
main{flex:1;min-width:0;padding:35px;max-width:1450px;margin:auto}
header{
 display:flex;justify-content:space-between;
 align-items:center;gap:15px;flex-wrap:wrap;
}
h1{font-size:30px;margin:0 0 8px;letter-spacing:-1px}
h2{font-size:19px}
p{color:var(--muted)}
.btn{
 border:0;border-radius:11px;
 padding:12px 18px;background:var(--orange);
 color:#181818;font-weight:750;
}
.btn.alt{background:#35383d;color:white}
.btn.red{background:#492929;color:#ff9999}
.btn.small{padding:9px 12px;font-size:13px}
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:15px;margin:30px 0;
}
.stat,.panel{
 background:var(--panel);border:1px solid var(--line);
 border-radius:17px;padding:22px;
}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:30px;margin-top:13px}
.habit{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:17px;margin-bottom:13px;
 padding:20px;
}
.habit-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.emoji{
 width:48px;height:48px;border-radius:13px;
 display:grid;place-items:center;
 background:#323033;font-size:25px;
}
.info{flex:1;min-width:130px}
.info strong{font-size:16px;overflow-wrap:anywhere}
.info small{display:block;color:var(--muted);margin-top:6px}
.fire{color:var(--orange);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.history{
 display:grid;grid-template-columns:repeat(14,minmax(0,1fr));
 gap:5px;margin-top:20px;
}
.cell{
 aspect-ratio:1;border-radius:5px;
 background:#35383c;min-width:0;
}
.cell.done{background:var(--green)}
.cell.missed{background:var(--red)}
.cell.today{outline:2px solid var(--orange);outline-offset:1px}
.cell.future{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.legend span{font-size:12px;color:var(--muted)}
.legend i{
 display:inline-block;width:9px;height:9px;
 border-radius:3px;margin-right:5px;
}
.timer{
 display:flex;align-items:center;gap:10px;
 flex-wrap:wrap;margin-top:15px;
}
.timer-time{
 font-size:20px;font-weight:800;
 font-variant-numeric:tabular-nums;
 margin-right:auto;
}
.month-grid{
 display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:7px;
}
.day{
 min-height:75px;background:var(--panel2);
 border-radius:10px;padding:8px;
 border:1px solid transparent;
}
.day.current{border-color:var(--orange)}
.day span{font-size:12px}
.day-dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.dot{width:9px;height:9px;border-radius:50%}
.month-head{
 display:flex;justify-content:space-between;
 align-items:center;gap:12px;margin-bottom:20px;
}
.month-head strong{text-transform:capitalize}
.weekday{text-align:center;color:var(--muted);font-size:12px;padding:8px}
.record{
 display:flex;justify-content:space-between;gap:12px;
 padding:14px 0;border-bottom:1px solid var(--line);
 flex-wrap:wrap;
}
.record small{color:var(--muted)}
.hidden{display:none!important}
.overlay{
 position:fixed;inset:0;background:#000b;
 display:grid;place-items:center;padding:15px;z-index:10;
}
.modal{
 background:#222428;border:1px solid var(--line);
 border-radius:20px;padding:26px;
 width:100%;max-width:460px;max-height:95vh;overflow:auto;
}
label{display:block;font-size:13px;color:#ccc;margin:16px 0 8px}
input,select{
 background:#151619;border:1px solid var(--line);
 color:white;border-radius:10px;padding:12px;width:100%;
}
input[type=color]{height:45px;padding:4px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:850px){
 .layout{display:block}
 aside{width:100%;padding:14px;border-right:0;border-bottom:1px solid var(--line)}
 .logo{margin:0 0 14px}
 .navbox{display:flex;overflow:auto;gap:5px}
 .nav{white-space:nowrap;width:auto;margin:0}
 main{padding:22px 14px}
 .stats{grid-template-columns:repeat(2,1fr);gap:9px}
 .stat{padding:15px}
 .stat strong{font-size:25px}
 .history{grid-template-columns:repeat(14,minmax(0,1fr))}
 .day{min-height:55px;padding:5px}
}
</style>
</head>
<body>
<div class="layout">
<aside>
 <div class="logo">EMBER<span>.</span></div>
 <div class="navbox">
  <button class="nav active" data-page="dashboard">◈ Головна</button>
  <button class="nav" data-page="calendar">▦ Календар</button>
  <button class="nav" data-page="history">◷ Історія</button>
  <button class="nav" data-page="analytics">▥ Статистика</button>
 </div>
</aside>
<main>
 <section id="dashboard">
  <header>
   <div><h1>Мої звички 🔥</h1><p id="dateText"></p></div>
   <button class="btn" onclick="openEditor()">+ Нова звичка</button>
  </header>
  <div class="stats" id="stats"></div>
  <h2>Твій сьогоднішній прогрес</h2>
  <div id="habitList"></div>
 </section>
 <section id="calendar" class="hidden">
  <h1>Календар</h1>
  <p>Усі виконання та пропуски</p>
  <div class="panel">
   <div class="month-head">
    <button class="btn alt small" onclick="moveMonth(-1)">←</button>
    <strong id="monthTitle"></strong>
    <button class="btn alt small" onclick="moveMonth(1)">→</button>
   </div>
   <div class="month-grid" id="monthGrid"></div>
   <div class="legend">
    <span><i style="background:var(--green)"></i>Виконано</span>
    <span><i style="background:var(--red)"></i>Пропущено</span>
    <span><i style="background:#555"></i>Без запису</span>
   </div>
  </div>
 </section>
 <section id="history" class="hidden">
  <h1>Історія занять</h1>
  <p>Записи часу за всі дні</p>
  <div class="panel" id="sessionList"></div>
 </section>
 <section id="analytics" class="hidden">
  <h1>Статистика</h1>
  <p>Твої результати за весь час</p>
  <div class="stats" id="analyticsStats"></div>
  <div id="analyticsList"></div>
 </section>
</main>
</div>

<div class="overlay hidden" id="overlay">
 <div class="modal">
  <h2 id="editorTitle">Нова звичка</h2>
  <form id="editorForm">
   <label>Назва звички</label>
   <input id="nameInput" required maxlength="70"
    placeholder="Наприклад: вивчати англійську">
   <label>Емодзі</label>
   <input id="emojiInput" value="🔥" maxlength="8">
   <label>Категорія</label>
   <select id="categoryInput">
    <option>Саморозвиток</option>
    <option>Спорт</option>
    <option>Навчання</option>
    <option>Робота</option>
    <option>Здоров'я</option>
    <option>Творчість</option>
    <option>Інше</option>
   </select>
   <label>Колір</label>
   <input id="colorInput" type="color" value="#ff9340">
   <label>Ціль: днів на тиждень</label>
   <select id="targetInput">
    <option value="7">7 днів</option>
    <option value="6">6 днів</option>
    <option value="5">5 днів</option>
    <option value="4">4 дні</option>
    <option value="3">3 дні</option>
    <option value="2">2 дні</option>
    <option value="1">1 день</option>
   </select>
   <div class="modal-actions">
    <button type="button" class="btn alt" onclick="closeEditor()">Скасувати</button>
    <button class="btn" type="submit">Зберегти</button>
   </div>
  </form>
 </div>
</div>

<script>
const KEY="ember-habits-v2";
const $=id=>document.getElementById(id);
let habits=[];
let editing=null;
let month=new Date();
let activeTimer=null;
let timerStarted=0;
let timerInterval=null;

function load(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  habits=Array.isArray(data)?data:[];
 }catch{habits=[]}
 habits.forEach(h=>{
  h.days ||= {};
  h.sessions ||= [];
 });
}
function save(){localStorage.setItem(KEY,JSON.stringify(habits))}
function key(d=new Date()){
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fromKey(k){
 const [y,m,d]=k.split("-").map(Number);
 return new Date(y,m-1,d,12);
}
function shift(n){
 const d=new Date();d.setHours(12,0,0,0);
 d.setDate(d.getDate()+n);return key(d);
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function done(h,k=key()){return h.days[k]==="done"}
function missed(h,k=key()){return h.days[k]==="missed"}
function doneCount(h){return Object.values(h.days).filter(v=>v==="done").length}
function missCount(h){return Object.values(h.days).filter(v=>v==="missed").length}
function totalTime(h){
 return h.sessions.reduce((sum,s)=>sum+s.seconds,0);
}
function formatTime(seconds){
 seconds=Math.max(0,Math.floor(seconds));
 const h=Math.floor(seconds/3600);
 const m=Math.floor(seconds%3600/60);
 const s=seconds%60;
 return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}
function streak(h){
 let d=new Date();d.setHours(12,0,0,0);
 if(!done(h,key(d)))d.setDate(d.getDate()-1);
 let count=0;
 while(done(h,key(d))){
  count++;d.setDate(d.getDate()-1);
 }
 return count;
}
function bestStreak(h){
 const dates=Object.keys(h.days).filter(k=>done(h,k)).sort();
 let best=0,run=0,prev=null;
 for(const k of dates){
  const diff=prev?Math.round((fromKey(k)-fromKey(prev))/86400000):0;
  run=diff===1?run+1:1;
  best=Math.max(best,run);prev=k;
 }
 return best;
}
function stat(label,value){
 return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`;
}
function mark(id,status){
 const h=habits.find(x=>x.id===id);if(!h)return;
 if(h.days[key()]===status)delete h.days[key()];
 else h.days[key()]=status;
 save();render();
}
function openEditor(id=null){
 editing=id;
 $("editorForm").reset();
 $("colorInput").value="#ff9340";
 $("editorTitle").textContent=id?"Редагувати звичку":"Нова звичка";
 if(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  $("nameInput").value=h.name;
  $("emojiInput").value=h.emoji;
  $("categoryInput").value=h.category;
  $("colorInput").value=h.color;
  $("targetInput").value=h.target;
 }
 $("overlay").classList.remove("hidden");
}
function closeEditor(){
 $("overlay").classList.add("hidden");editing=null;
}
$("editorForm").addEventListener("submit",e=>{
 e.preventDefault();
 const data={
  name:$("nameInput").value.trim(),
  emoji:$("emojiInput").value.trim()||"🔥",
  category:$("categoryInput").value,
  color:$("colorInput").value,
  target:Number($("targetInput").value)
 };
 if(!data.name)return;
 if(editing){
  const h=habits.find(x=>x.id===editing);
  if(h)Object.assign(h,data);
 }else{
  habits.push({
   id:crypto.randomUUID(),...data,
   created:key(),days:{},sessions:[]
  });
 }
 save();closeEditor();render();
});
$("overlay").addEventListener("click",e=>{
 if(e.target===$("overlay"))closeEditor();
});
function deleteHabit(id){
 if(!confirm("Видалити звичку, її час та всю історію?"))return;
 if(activeTimer===id)stopTimer();
 habits=habits.filter(h=>h.id!==id);
 save();render();
}
function startTimer(id){
 if(activeTimer!==null){
  alert("Спочатку заверши поточний таймер.");
  return;
 }
 activeTimer=id;
 timerStarted=Date.now();
 render();
 timerInterval=setInterval(updateTimer,1000);
}
function updateTimer(){
 const el=$("timer-"+activeTimer);
 if(el)el.textContent=formatTime((Date.now()-timerStarted)/1000);
}
function stopTimer(){
 if(activeTimer===null)return;
 const h=habits.find(x=>x.id===activeTimer);
 const seconds=Math.max(1,Math.floor((Date.now()-timerStarted)/1000));
 if(h){
  h.sessions.push({
   id:crypto.randomUUID(),
   date:key(),
   timestamp:Date.now(),
   seconds
  });
  h.days[key()]="done";
 }
 clearInterval(timerInterval);
 activeTimer=null;
 timerStarted=0;
 save();render();
}
function renderDashboard(){
 const complete=habits.filter(h=>done(h)).length;
 const misses=habits.reduce((s,h)=>s+missCount(h),0);
 const seconds=habits.reduce((s,h)=>s+totalTime(h),0);
 const best=habits.length?Math.max(...habits.map(bestStreak)):0;
 $("dateText").textContent=new Intl.DateTimeFormat("uk-UA",{
  weekday:"long",day:"numeric",month:"long",year:"numeric"
 }).format(new Date());
 $("stats").innerHTML=
  stat("Виконано сьогодні",complete+"/"+habits.length)+
  stat("Усі пропуски",misses)+
  stat("Час занять",formatTime(seconds))+
  stat("Рекорд вогника","🔥 "+best);

 $("habitList").innerHTML=habits.length?habits.map(h=>{
  let cells="";
  for(let i=55;i>=0;i--){
   const k=shift(-i);
   const state=h.days[k];
   const cls=state==="done"?"done":state==="missed"?"missed":"";
   cells+=`<div class="cell ${cls} ${k===key()?"today":""}"
    title="${k}: ${state==="done"?"Виконано":state==="missed"?"Пропущено":"Без запису"}"></div>`;
  }
  return `<div class="habit">
   <div class="habit-top">
    <div class="emoji">${esc(h.emoji)}</div>
    <div class="info">
     <strong>${esc(h.name)}</strong>
     <small>${esc(h.category)} · Ціль ${h.target}/7 днів</small>
     <small class="fire">🔥 ${streak(h)} днів поспіль · Рекорд ${bestStreak(h)}</small>
    </div>
    <div class="actions">
     <button class="btn small" onclick="mark('${h.id}','done')">
      ${done(h)?"✓ Виконано":"✓ Виконати"}
     </button>
     <button class="btn alt small" onclick="mark('${h.id}','missed')">
      ${missed(h)?"↩ Скасувати пропуск":"✕ Пропуск"}
     </button>
     <button class="btn alt small" onclick="openEditor('${h.id}')">✎</button>
     <button class="btn red small" onclick="deleteHabit('${h.id}')">Видалити</button>
    </div>
   </div>
   <div class="timer">
    <div class="timer-time" id="timer-${h.id}">
     ${activeTimer===h.id?formatTime((Date.now()-timerStarted)/1000):formatTime(totalTime(h))}
    </div>
    ${activeTimer===h.id?
      `<button class="btn small" onclick="stopTimer()">■ Завершити</button>`:
      `<button class="btn alt small" onclick="startTimer('${h.id}')">▶ Почати таймер</button>`}
   </div>
   <div class="history">${cells}</div>
   <div class="legend">
    <span><i style="background:var(--green)"></i>Виконано: ${doneCount(h)}</span>
    <span><i style="background:var(--red)"></i>Пропущено: ${missCount(h)}</span>
    <span>◷ ${formatTime(totalTime(h))}</span>
   </div>
  </div>`;
 }).join(""):`<div class="panel empty">
  <h2>Почни свою першу серію 🔥</h2>
  <p>Створи будь-яку звичку та відстежуй результат.</p>
  <button class="btn" onclick="openEditor()">+ Створити</button>
 </div>`;
}
function moveMonth(n){
 month=new Date(month.getFullYear(),month.getMonth()+n,1);
 renderCalendar();
}
function renderCalendar(){
 const y=month.getFullYear(),m=month.getMonth();
 $("monthTitle").textContent=new Intl.DateTimeFormat("uk-UA",{
  month:"long",year:"numeric"
 }).format(month);
 let html=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"]
  .map(x=>`<div class="weekday">${x}</div>`).join("");
 const offset=(new Date(y,m,1).getDay()+6)%7;
 for(let i=0;i<offset;i++)html+="<div></div>";
 const count=new Date(y,m+1,0).getDate();
 for(let day=1;day<=count;day++){
  const k=key(new Date(y,m,day));
  const dots=habits.filter(h=>h.days[k]).map(h=>
   `<span class="dot" title="${esc(h.name)}"
    style="background:${h.days[k]==="done"?"var(--green)":"var(--red)"}"></span>`
  ).join("");
  html+=`<div class="day ${k===key()?"current":""}">
   <span>${day}</span><div class="day-dots">${dots}</div>
  </div>`;
 }
 $("monthGrid").innerHTML=html;
}
function renderHistory(){
 const sessions=habits.flatMap(h=>
  h.sessions.map(s=>({...s,name:h.name,emoji:h.emoji,habitId:h.id}))
 ).sort((a,b)=>b.timestamp-a.timestamp);
 $("sessionList").innerHTML=sessions.length?sessions.map(s=>
  `<div class="record">
   <div><strong>${esc(s.emoji)} ${esc(s.name)}</strong>
    <br><small>${esc(s.date)}</small></div>
   <div><strong>${formatTime(s.seconds)}</strong>
    <button class="btn red small" onclick="deleteSession('${s.habitId}','${s.id}')">✕</button>
   </div>
  </div>`
 ).join(""):`<div class="empty">Поки немає записів часу.</div>`;
}
function deleteSession(hid,sid){
 if(!confirm("Видалити цей запис часу?"))return;
 const h=habits.find(x=>x.id===hid);
 if(!h)return;
 h.sessions=h.sessions.filter(s=>s.id!==sid);
 save();render();
}
function renderAnalytics(){
 const doneTotal=habits.reduce((s,h)=>s+doneCount(h),0);
 const missedTotal=habits.reduce((s,h)=>s+missCount(h),0);
 const seconds=habits.reduce((s,h)=>s+totalTime(h),0);
 const activeDays=new Set(habits.flatMap(h=>
  Object.keys(h.days).filter(k=>h.days[k]==="done")
 )).size;
 $("analyticsStats").innerHTML=
  stat("Усі виконання",doneTotal)+
  stat("Усі пропуски",missedTotal)+
  stat("Активних днів",activeDays)+
  stat("Усього часу",formatTime(seconds));
 $("analyticsList").innerHTML=habits.map(h=>{
  const total=doneCount(h)+missCount(h);
  const rate=total?Math.round(doneCount(h)/total*100):0;
  return `<div class="panel" style="margin-bottom:12px">
   <h2>${esc(h.emoji)} ${esc(h.name)}</h2>
   <p>🔥 Поточна серія: ${streak(h)} · Рекорд: ${bestStreak(h)}</p>
   <p>✓ Виконано: ${doneCount(h)} · ✕ Пропущено: ${missCount(h)}</p>
   <p>◷ Час: ${formatTime(totalTime(h))}</p>
   <p>Успішність серед відмічених днів: ${rate}%</p>
   <div style="height:9px;background:#34363b;border-radius:20px;overflow:hidden">
    <div style="height:100%;width:${rate}%;background:${h.color}"></div>
   </div>
  </div>`;
 }).join("")||`<div class="panel empty">Ще немає статистики.</div>`;
}
function render(){
 renderDashboard();
 renderCalendar();
 renderHistory();
 renderAnalytics();
}
document.querySelectorAll(".nav").forEach(b=>{
 b.addEventListener("click",()=>{
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));
  $(b.dataset.page).classList.remove("hidden");
  render();
 });
});
load();
render();
</script>
</body>
</html>
